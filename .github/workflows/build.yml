name: Build desktop

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: LuminaStudio-Windows
            files: |
              dist/*.exe
          - os: ubuntu-latest
            target: --linux
            artifact: LuminaStudio-Linux
            files: |
              dist/*.AppImage
          - os: macos-latest
            target: --mac
            artifact: LuminaStudio-macOS
            files: |
              dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Empacotar
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Um único job publica o release depois que os três sistemas terminam
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          name: Lumina Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Baixe pelo site: https://mello13256.github.io/Photoshop/

            | Sistema | Arquivo |
            |---|---|
            | Windows (instalador) | LuminaStudio-Setup.exe |
            | Windows (portátil) | LuminaStudio-Portable.exe |
            | macOS (Apple Silicon) | LuminaStudio-macOS.dmg |
            | Linux | LuminaStudio-Linux.AppImage |
          files: |
            dist/LuminaStudio-Setup.exe
            dist/LuminaStudio-Portable.exe
            dist/LuminaStudio-macOS.dmg
            dist/LuminaStudio-Linux.AppImage
          fail_on_unmatched_files: true
